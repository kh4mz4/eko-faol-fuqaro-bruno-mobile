info:
  name: diagrama
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/step/mobile/step/step_detail?period=day"
  headers:
    - name: Token
      value: "{{client_session}}"
  params:
    - name: period
      value: week
      type: query
      disabled: true
    - name: period
      value: month
      type: query
      disabled: true
    - name: period
      value: day
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
