info:
  name: diagrama
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/task/mobile/weight/get_weight_diagram?type=month"
  headers:
    - name: Token
      value: "{{client_session}}"
  params:
    - name: type
      value: month
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
