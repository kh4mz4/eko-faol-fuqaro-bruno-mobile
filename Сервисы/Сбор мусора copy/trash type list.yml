info:
  name: trash type list
  type: http
  seq: 5

http:
  method: GET
  url: "{{base_url}}/directory/mobile/trash_type/get_trash_type?page=1&page_size=10"
  headers:
    - name: Token
      value: "{{client_session}}"
  params:
    - name: page
      value: "1"
      type: query
    - name: page_size
      value: "10"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
